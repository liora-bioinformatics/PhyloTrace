name: Scheme Index Update

# Weekly check of the providers' public scheme listings. Changes arrive as a
# pull request against dev/scheme_index/curation.csv and the app's index, and
# are e-mailed with the same mail secrets as link_check.yml; new
# schemes stay "pending" until a maintainer reviews them, so nothing reaches
# the app unreviewed. Which providers are read, and why, is in
# dev/scheme_index/config.json.
#
# Actions are pinned to release tags; pinning them to full commit SHAs (with
# the tag in a comment) is recommended to rule out a moved tag.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Read-only by default; only the job that opens the pull request may write.
permissions:
  contents: read

concurrency:
  group: scheme-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      MAIL_SERVER: ${{ secrets.LINK_CHECK_SMTP_SERVER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the index tooling
        run: python -m unittest discover -s dev/scheme_index -p 'test_*.py' -v

      - name: Read the provider listings and rebuild the index
        id: update
        run: |
          set +e
          python dev/scheme_index/scheme_index.py update --report "$RUNNER_TEMP/scheme-index-report.md"
          status=$?
          set -e
          # Exit code 1 means curation rows need fixing; the pull request is
          # still opened, with the problems listed, so a maintainer sees them.
          echo "problems=$([ "$status" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          cat "$RUNNER_TEMP/scheme-index-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Show what changed
        run: git status --short && git diff --stat

      - name: Open a pull request with the changes
        id: pr
        # Skipped when run locally with `act`, which cannot open pull requests.
        if: ${{ !env.ACT }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/scheme-index
          delete-branch: true
          add-paths: |
            dev/scheme_index/curation.csv
            app/logic/data/scheme_index.csv
          commit-message: Update scheme index from provider listings
          title: 'Scheme index: provider listing changes'
          body-path: ${{ runner.temp }}/scheme-index-report.md
          labels: scheme-index

      - name: E-mail the maintainers
        # Only when the run opened or updated the pull request, i.e. found something new; skipped
        # with `act` and without the mail secrets (shared with link_check.yml).
        if: >-
          ${{ !env.ACT && env.MAIL_SERVER != '' &&
          (steps.pr.outputs.pull-request-operation == 'created' ||
          steps.pr.outputs.pull-request-operation == 'updated') }}
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.LINK_CHECK_SMTP_SERVER }}
          server_port: ${{ secrets.LINK_CHECK_SMTP_PORT }}
          username: ${{ secrets.LINK_CHECK_SMTP_USERNAME }}
          password: ${{ secrets.LINK_CHECK_SMTP_PASSWORD }}
          to: ${{ secrets.LINK_CHECK_MAIL_TO }}
          from: ${{ secrets.LINK_CHECK_MAIL_FROM }}
          subject: 'PhyloTrace scheme index: provider listing changes'
          body: |
            The scheme index run found changes and opened a pull request for review:
            ${{ steps.pr.outputs.pull-request-url }}

            The report is attached.
          attachments: ${{ runner.temp }}/scheme-index-report.md
