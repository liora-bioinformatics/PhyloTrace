# PhyloTrace conda environment — everything the app needs: R itself, every
# R package the Shiny app imports, and the external CLI bioinformatics
# toolchain (wgMLST/claMLST, blat, mafft, abritamr, amrfinderplus) it shells
# out to directly. One env, conda owns all of it — no renv, no separate R
# package library, and no `conda run -n <env>` indirection: the app already
# runs inside this env, so the tools are just on PATH.
#
#   - R + Shiny/rhino stack                        -> the app itself
#   - nodejs                                        -> rhino::build_sass()
#   - pyMLST (wgMLST / claMLST) + blat + mafft      -> cgMLST + classical typing
#   - abritamr + ncbi-amrfinderplus (blast+hmmer)   -> AMR screening
#
# Rebuild from scratch:   conda env create -f environment.yml
# Update an existing env:  conda env update -f environment.yml --prune
#
# pyMLST is pinned to 2.2.2 via pip — the version the typing/parsing logic in
# loop-pymlst.sh + pymlst.R is written against — and installed non-editable so
# it stays self-contained (an editable install from a since-deleted checkout is
# what originally broke scheme downloads).
#
# r-visnetwork is pinned to fpaskali's patched build, not conda-forge's stock
# one — keep the exact pin.
name: PhyloTrace
channels:
  - fpaskali
  - conda-forge
  - bioconda
dependencies:
  - r-base
  - nodejs
  # --- R packages the app imports directly ---
  - r-ape
  - r-base64enc
  - r-box
  - r-bslib
  - r-cowplot
  - r-curl
  - r-dbi
  - r-dplyr
  - r-dt
  - r-fs
  - r-ggnewscale
  - r-ggplot2
  - r-ggplotify
  - r-htmltools
  - r-htmlwidgets
  - r-igraph
  - r-jsonlite
  - r-later
  - r-leaflet
  - r-leaflet.extras
  - r-leaflet.minicharts
  - r-openssl
  - r-openxlsx
  - r-processx
  - r-rcolorbrewer
  - r-rhino
  - r-rnaturalearth
  - r-rnaturalearthdata
  - r-rsqlite
  - r-rvest
  - r-sf
  - r-shiny
  - r-shinyfiles
  - r-shinyjs
  - r-shinywidgets
  - r-svglite
  - r-terra
  - r-testthat
  - r-tibble
  - r-tidygeocoder
  - r-tidyr
  - r-viridislite
  - r-visnetwork=2.1.4=r43_0
  - r-waiter
  - r-withr
  - r-zip
  - bioconductor-ggtree
  - bioconductor-ggtreeextra
  - bioconductor-complexheatmap
  # --- cgMLST / classical MLST typing (pyMLST toolchain) ---
  - python=3.12
  - blat=35
  - mafft=7.525
  # --- AMR screening (blast + hmmer come in transitively) ---
  - abritamr=1.0.19
  - ncbi-amrfinderplus=3.12.8
  # --- pyMLST itself (pip, pinned, non-editable) ---
  - pip
  - pip:
      - pymlst==2.2.2
